name: Publish

# Both the canary snapshot publish and the gated stable publish live in this
# one file on purpose: npm Trusted Publishing allows exactly one trusted
# publisher configuration per package, bound to a single workflow filename.
# Splitting canary/release into separate files (as an earlier version of
# this pipeline did) would require registering two trusted publishers per
# package, which npm doesn't support. Everything that can call `npm publish`
# for these packages has to live here, with job-level `if:`/`environment:`
# doing the branching instead of separate files.
#
# When registering the trusted publisher on npmjs.com for each package,
# leave the "environment" field blank — the `canary` job runs without a
# GitHub Environment, while `release` runs under the `release` Environment,
# and a trusted publisher scoped to one environment would reject the other.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  canary:
    name: Publish canary
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm install

      - name: Build all packages
        run: npx turbo run build

      - name: Check for pending changesets
        # With zero pending changesets (the state right after a Version
        # Packages PR merges), `changeset version --snapshot` has nothing to
        # bump and is a no-op — package.json is already sitting at exactly
        # the next real release version. Publishing that under --tag canary
        # anyway would burn the real version string on the registry before
        # the release job gets to it, and since npm never allows publishing
        # the same exact version twice, the release job's publish of that
        # package (to `latest`) then hard-fails with 409 Conflict. Skip the
        # snapshot publish entirely in that case; there's nothing to preview.
        id: pending
        run: |
          PENDING=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          echo "count=$PENDING" >> "$GITHUB_OUTPUT"

      - name: Version packages as snapshot
        # `--snapshot canary` lets changesets own the whole prerelease suffix
        # (base version + "canary" + its own run-time timestamp) rather than
        # us trying to compose it ourselves — changesets appends its own
        # timestamp after whatever tag it's given regardless, so a
        # hand-rolled suffix only doubles up. This mutates package.json/
        # CHANGELOGs and consumes .changeset/*.md in the runner's working
        # copy only. Nothing here is ever committed or pushed back to main,
        # so the pending changesets stay intact for the real Version
        # Packages PR (see version.yml).
        if: steps.pending.outputs.count > 0
        run: npx changeset version --snapshot canary

      - name: Publish canary packages
        # --no-git-tag: snapshot versions are throwaway, no reason to cut a
        # git tag for them (and nothing here ever gets pushed regardless).
        if: steps.pending.outputs.count > 0
        run: npx changeset publish --tag canary --no-git-tag

  check:
    name: Check release readiness
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Determine release readiness
        id: check
        # Ready only once a Version Packages PR has been merged: no
        # changesets left pending, and at least one public package's local
        # version hasn't been published yet.
        run: |
          PENDING=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          if [ "$PENDING" -gt 0 ]; then
            echo "Pending changesets found ($PENDING); nothing to release yet."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          READY=false
          for pkg_dir in packages/* a2a-*; do
            [ -f "$pkg_dir/package.json" ] || continue
            PRIVATE=$(node -p "require('./$pkg_dir/package.json').private || false")
            if [ "$PRIVATE" = "true" ]; then continue; fi
            NAME=$(node -p "require('./$pkg_dir/package.json').name")
            LOCAL_VERSION=$(node -p "require('./$pkg_dir/package.json').version")
            PUBLISHED_VERSION=$(npm view "$NAME" version 2>/dev/null || echo "")
            echo "$NAME: local=$LOCAL_VERSION published=${PUBLISHED_VERSION:-<unpublished>}"
            if [ "$LOCAL_VERSION" != "$PUBLISHED_VERSION" ]; then
              READY=true
            fi
          done
          echo "ready=$READY" >> "$GITHUB_OUTPUT"

  release:
    name: Publish stable release
    needs: check
    if: needs.check.outputs.ready == 'true'
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm install

      - name: Build all packages
        run: npx turbo run build

      - name: Test all packages
        run: npx turbo run test

      - name: Verify a2a-antigravity managed Python setup
        run: node a2a-antigravity/dist/cli.js setup --venv-dir "$RUNNER_TEMP/a2a-antigravity-venv"

      - name: Verify a2a-antigravity npm package contents
        run: npm pack -w a2a-antigravity --dry-run

      - name: Publish to npm
        # createGithubReleases: false suppresses this action's normal
        # one-release-per-package behavior (it still tags each published
        # package, since push-git-tags defaults to true and stays on) — the
        # step below creates a single combined release instead.
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create combined GitHub release
        # One release page per publish run, covering every package that
        # actually published (from `publishedPackages` — packages with
        # nothing new this run are absent, never mentioned). Body is
        # assembled from each published package's own CHANGELOG.md section
        # for its new version, so it matches what changesets already wrote
        # rather than a second, hand-maintained description.
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          set -euo pipefail

          : > release-notes.md
          echo "$PUBLISHED_PACKAGES" | jq -c '.[]' | while read -r entry; do
            NAME=$(echo "$entry" | jq -r '.name')
            VERSION=$(echo "$entry" | jq -r '.version')

            DIR=""
            for pkg_dir in packages/* a2a-*; do
              [ -f "$pkg_dir/package.json" ] || continue
              PKG_NAME=$(node -p "require('./$pkg_dir/package.json').name")
              if [ "$PKG_NAME" = "$NAME" ]; then
                DIR="$pkg_dir"
                break
              fi
            done
            if [ -z "$DIR" ]; then
              echo "::warning::Could not find package directory for $NAME, skipping its changelog in the combined release"
              continue
            fi

            {
              echo "### $NAME@$VERSION"
              echo
              awk -v ver="## $VERSION" '
                $0 ~ /^## / {
                  if (found) exit
                  if ($0 == ver || index($0, ver" ") == 1) { found = 1; next }
                }
                found { print }
              ' "$DIR/CHANGELOG.md"
              echo
            } >> release-notes.md
          done

          DATE=$(date -u +%Y-%m-%d)
          TAG="release-${DATE}-${{ github.run_number }}"

          gh release create "$TAG" \
            --title "Release ${DATE}" \
            --notes-file release-notes.md
