name: Downloads Badge

# Computes all-time npm download totals for every published package
# (scripts/downloads-badge.mjs) and commits the result as shields.io
# endpoint-badge JSON to a dedicated `badges` branch (not `main` — this
# keeps generated data out of main's history and off to the side of any
# branch protection rule on `main`). The README points a shields.io
# endpoint badge at the raw file on that branch.

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

env:
  BADGES_DIR: .github/badges

jobs:
  update-badge:
    name: Update downloads badge data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Compute total downloads
        run: node scripts/downloads-badge.mjs

      - name: Commit and push to badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$BADGES_DIR"
          if git diff --cached --quiet; then
            echo "Download counts unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: update downloads badge data [skip ci]"
          git push --force origin HEAD:badges
