name: Canary

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: canary-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  canary:
    name: Publish canary
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm install

      - name: Build all packages
        run: npx turbo run build

      - name: Compute canary tag
        id: tag
        run: |
          TAG="canary.$(TZ=UTC git show -s --format=%cd --date=format:%Y%m%d%H%M%S HEAD)"
          echo "Canary tag: $TAG"
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Version packages as snapshot
        # This mutates package.json/CHANGELOGs and consumes .changeset/*.md
        # in the runner's working copy only. Nothing here is ever committed
        # or pushed back to main, so the pending changesets stay intact for
        # the real Version Packages PR (see version.yml).
        run: npx changeset version --snapshot ${{ steps.tag.outputs.value }}

      - name: Publish canary packages
        run: npx changeset publish --tag canary
